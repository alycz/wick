name: CI

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test

  anchor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11.25.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - uses: dtolnay/rust-toolchain@1.85.1
      # Install the Solana CLI with Anza's official installer. metadaoproject/setup-solana@v1.2
      # resolves its own scripts/channel-info.sh against this repo and fails before installing.
      - name: Install Solana CLI 2.2.20
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v2.2.20/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo install --locked anchor-cli --version 0.31.1
      - run: pnpm install --frozen-lockfile
      - run: mkdir -p ~/.config/solana target/deploy
      - run: solana-keygen new --no-bip39-passphrase --silent --force --outfile ~/.config/solana/id.json
      - run: solana-keygen new --no-bip39-passphrase --silent --force --outfile target/deploy/wick-keypair.json
      - run: anchor keys sync
      # anchor keys sync (0.31.1) rewrites only the first [programs.*] section of Anchor.toml,
      # leaving [programs.localnet] on the old id, so the validator loads the program at an
      # address that doesn't match its declare_id. Point every cluster at the CI keypair.
      - name: Point all Anchor.toml clusters at the CI program id
        run: |
          PROGRAM_ID=$(solana address -k target/deploy/wick-keypair.json)
          sed -i -E "s/^wick = \".*\"/wick = \"$PROGRAM_ID\"/" Anchor.toml
          grep -n '^wick = ' Anchor.toml
          grep -n 'declare_id!' programs/wick/src/lib.rs
      - run: anchor build
      - name: Check program ids match
        run: |
          PROGRAM_ID=$(solana address -k target/deploy/wick-keypair.json)
          test "$(jq -r .address target/idl/wick.json)" = "$PROGRAM_ID"
          test "$(grep -c "^wick = \"$PROGRAM_ID\"" Anchor.toml)" = "$(grep -c '^wick = ' Anchor.toml)"
          grep -q "declare_id!(\"$PROGRAM_ID\")" programs/wick/src/lib.rs
      - run: anchor test --skip-build
